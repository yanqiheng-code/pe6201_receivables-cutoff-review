services:
  - type: web
    name: pe6201-cutoff-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'cloud_app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_DAILY_CALL_LIMIT
        value: "200"
      - key: DEMO_DATA_DIR
        value: /tmp/pe6201-demo
